<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Background: transparent -->

  <!-- Arced "DWEILORKEST" text at top -->
  <defs>
    <path id="topArc" d="M 40,170 A 120,120 0 0,1 260,170" />
    <path id="bottomArc" d="M 30,200 A 130,130 0 0,0 270,200" />
  </defs>
  <text font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#CC0000" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">DWEILORKEST</textPath>
  </text>

  <!-- Drum shadow -->
  <ellipse cx="150" cy="230" rx="75" ry="14" fill="#c0c0c0" opacity="0.5"/>

  <!-- Drum body: white cylinder side band -->
  <rect x="80" y="135" width="140" height="80" rx="4" fill="white" stroke="#111" stroke-width="3"/>

  <!-- Drum top face (black ellipse) -->
  <ellipse cx="150" cy="135" rx="70" ry="22" fill="#111111" stroke="#111" stroke-width="3"/>

  <!-- Drum bottom face (black ellipse) -->
  <ellipse cx="150" cy="215" rx="70" ry="22" fill="#111111" stroke="#111" stroke-width="3"/>

  <!-- Drum tension rods (red) - left side -->
  <line x1="100" y1="130" x2="96" y2="218" stroke="#CC0000" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="120" y1="126" x2="117" y2="220" stroke="#CC0000" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Drum tension rods (red) - right side -->
  <line x1="200" y1="130" x2="204" y2="218" stroke="#CC0000" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="180" y1="126" x2="183" y2="220" stroke="#CC0000" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Music note on drum face (white) -->
  <!-- Note stem -->
  <line x1="160" y1="155" x2="160" y2="195" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Note head 1 -->
  <ellipse cx="153" cy="196" rx="9" ry="7" fill="white" transform="rotate(-20,153,196)"/>
  <!-- Note flag (beam) -->
  <path d="M160,155 Q180,163 175,175" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Second note head -->
  <ellipse cx="168" cy="179" rx="9" ry="7" fill="white" transform="rotate(-20,168,179)"/>
  <!-- Beam connecting both -->
  <line x1="175" y1="175" x2="175" y2="160" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- "ALES FEKEERT" text at bottom -->
  <text
    x="150"
    y="268"
    font-family="Georgia, serif"
    font-size="26"
    font-weight="bold"
    fill="#CC0000"
    text-anchor="middle"
    letter-spacing="2"
  >ALES FEKEERT</text>
</svg>
